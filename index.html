<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPulse - Advanced Todo App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6 md:p-8">
        
        <!-- App Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-indigo-400">TaskPulse 🚀</h1>
                <p class="text-xs text-slate-400">Organize your workflow effortlessly</p>
            </div>
            <!-- Progress Pill -->
            <div id="progress-container" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-xl text-xs font-medium text-slate-300">
                Completed: <span id="completed-count" class="text-emerald-400 font-bold">0</span> / <span id="total-count">0</span>
            </div>
        </header>

        <!-- Input Form -->
        <form id="task-form" class="space-y-4 mb-6">
            <div>
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="What needs to be done?" 
                    required
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Category Select -->
                <select id="task-category" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="Work">💼 Work</option>
                    <option value="Personal">🏡 Personal</option>
                    <option value="Study">📚 Study</option>
                </select>
                <!-- Priority Select -->
                <select id="task-priority" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="Low">🟢 Low Priority</option>
                    <option value="Medium" selected>🟡 Medium Priority</option>
                    <option value="High">🔴 High Priority</option>
                </select>
                <!-- Due Date -->
                <input 
                    type="date" 
                    id="task-date" 
                    class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-indigo-500"
                >
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">
                <i class="fa-solid fa-plus mr-2"></i> Add Task
            </button>
        </form>

        <!-- Search & Filters Toolbar -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search tasks..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
            </div>
            <div class="flex gap-1.5 bg-slate-950 p-1 border border-slate-800 rounded-xl">
                <button data-filter="all" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 text-white transition">All</button>
                <button data-filter="active" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Active</button>
                <button data-filter="completed" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition">Completed</button>
            </div>
        </div>

        <!-- Task List Container -->
        <div id="task-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
            <!-- Tasks will be dynamically injected here via JavaScript -->
        </div>

        <!-- Empty State (Shown when no tasks exist) -->
        <div id="empty-state" class="hidden text-center py-12">
            <i class="fa-regular fa-clipboard text-4xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 text-sm">No tasks found. Time to relax or add a new one!</p>
        </div>

    </div>

    <!-- JavaScript code will go here -->
    <script src="app.js"></script>
</body>
</html>
